<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Record Payment | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard-shell.css" />
    <link rel="stylesheet" href="../../assets/css/accountant/dashboard.css" />
    <link rel="stylesheet" href="../../assets/css/accountant/record-payment.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../../assets/js/dashboard-shell.js" defer></script>
    <script src="../../assets/js/accountant/record-payment.js" defer></script>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <i class="fa-solid fa-mountain"></i>
          <span>PayFlow</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <button class="sidebar-logout" id="logout-btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
        </button>
      </aside>

      <div class="main-content">
        <div class="topbar">
          <h1>Record Payment</h1>
          <div class="topbar-user">
            <i class="fa-solid fa-circle-user"></i>
            <span id="user-name">Loading...</span>
          </div>
        </div>

        <div class="page-content">
          <a href="payments.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Approved Requests</a>

          <div id="request-summary">
            <p>Loading...</p>
          </div>

          <div class="form-card">
            <div class="error-message hidden" id="error-message"></div>
            <div class="success-message hidden" id="success-message"></div>

            <form id="payment-form">
              <label for="amount-paid">Amount Paid (₦) <span class="required">*</span></label>
              <input type="number" id="amount-paid" name="amount-paid" step="0.01" min="1" required>

              <label for="payment-date">Payment Date <span class="required">*</span></label>
              <input type="date" id="payment-date" name="payment-date" required>

              <label for="payment-reference">Payment Reference (optional)</label>
              <input type="text" id="payment-reference" name="payment-reference" placeholder="e.g. Bank transaction ref">

              <label for="proof-file">Proof of Payment <span class="required">*</span></label>
              <input type="file" id="proof-file" name="proof-file" required>

              <button type="submit">Confirm Payment</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
