<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment History | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard-shell.css" />
    <link rel="stylesheet" href="../../assets/css/accountant/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../../assets/js/dashboard-shell.js" defer></script>
    <script src="../../assets/js/accountant/history.js" defer></script>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <i class="fa-solid fa-mountain"></i>
          <span>PayFlow</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <button class="sidebar-logout" id="logout-btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
        </button>
      </aside>

      <div class="main-content">
        <div class="topbar">
          <h1>Payment History</h1>
          <div class="topbar-user">
            <i class="fa-solid fa-circle-user"></i>
            <span id="user-name">Loading...</span>
          </div>
        </div>

        <div class="page-content">
          <div class="section-header">
            <h2>All Payments You've Recorded</h2>
            <button
              id="export-btn"
              class="btn-primary"
              style="border: none; cursor: pointer"
            >
              <i class="fa-solid fa-file-excel"></i> Export Filtered to Excel
            </button>
          </div>

          <div class="filter-bar">
    <div class="filter-bar-header">
        <i class="fa-solid fa-filter"></i> Filter Payments
    </div>
    <div class="filter-bar-row">
        <div class="filter-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="filter-search" placeholder="Search subject...">
        </div>
        <div class="filter-field">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="filter-name" placeholder="Requester name...">
        </div>
        <div class="filter-field">
            <i class="fa-solid fa-building"></i>
            <select id="filter-sbu">
                <option value="">All SBUs</option>
                <option value="Light Hill Investment">Light Hill Investment</option>
                <option value="Logistics">Logistics</option>
                <option value="Insighthills">Insighthills</option>
                <option value="FX Index">FX Index</option>
            </select>
        </div>
        <div class="filter-field filter-date">
            <label>From</label>
            <input type="date" id="filter-from">
        </div>
        <div class="filter-field filter-date">
            <label>To</label>
            <input type="date" id="filter-to">
        </div>
        <button id="filter-clear" class="btn-clear-filter">
            <i class="fa-solid fa-rotate-left"></i> Clear
        </button>
    </div>
</div>

          <table class="data-table">
            <thead>
              <tr>
                <th>Request ID</th>
                <th>Requester</th>
                <th>Subject</th>
                <th>Amount Paid</th>
                <th>Payment Date</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr>
                <td colspan="5">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
