<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/auth/reset-password.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../../assets/js/auth/reset-password.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="reset-card">
        <div class="header">
          <div class="logo">
            <img src="../../assets/images/logo.jpg" alt="" />
          </div>
          <h2>Light Hill PayFlow</h2>
          <p>DIGITAL FINANCIAL REQUEST &amp; APPROVAL SYSTEM</p>
        </div>
        <hr />

        <div class="description">
          <i class="fa-solid fa-lock"></i>
          <h2>Reset Your Password</h2>
          <p>Enter the code sent to your email and choose a new password.</p>
        </div>

        <form action="" method="">
          <div class="error-message hidden" id="error-message"></div>

          <label>Verification Code <span class="required">*</span></label>
          <div class="otp-container">
            <input type="text" maxlength="1" class="otp-input" />
            <input type="text" maxlength="1" class="otp-input" />
            <input type="text" maxlength="1" class="otp-input" />
            <input type="text" maxlength="1" class="otp-input" />
            <input type="text" maxlength="1" class="otp-input" />
            <input type="text" maxlength="1" class="otp-input" />
          </div>

          <label for="new-password"
            >New Password <span class="required">*</span></label
          >
          <input
            type="password"
            id="new-password"
            name="new-password"
            placeholder="8+ characters"
            required
          />

          <label for="confirm-password"
            >Confirm New Password <span class="required">*</span></label
          >
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Repeat password"
            required
          />

          <button type="submit">Reset Password</button>
        </form>
        <hr />

        <p>
          Didn't receive the code? <a href="#" id="resend-link">Resend Code</a>
        </p>
      </div>
    </div>
  </body>
</html>
