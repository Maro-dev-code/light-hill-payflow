<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/auth/forgot-password.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../../assets/js/auth/forgot-password.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="forgot-card">
        <div class="header">
          <div class="logo">
            <img src="../../assets/images/logo.jpg" alt="" />
          </div>
          <h2>Light Hill PayFlow</h2>
          <p>DIGITAL FINANCIAL REQUEST &amp; APPROVAL SYSTEM</p>
        </div>
        <hr />

        <div class="description">
          <i class="fa-solid fa-key"></i>
          <h2>Forgot Password?</h2>
          <p>
            Enter your corporate email and we'll send you a code to reset your
            password.
          </p>
        </div>

        <form action="" method="">
          <div class="error-message hidden" id="error-message"></div>

          <label for="email"
            >Corporate Email Address <span class="required">*</span></label
          >
          <input
            type="email"
            id="email"
            name="email"
            placeholder="e.g. name@lighthill.com"
            required
          />

          <button type="submit">Send Reset Code</button>
        </form>
        <hr />

        <p>
          Remember your password?
          <a href="login.html" id="back-to-login">Back to Sign In</a>
        </p>
      </div>
    </div>
  </body>
</html>
