<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/auth/verify-email.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="../../assets/js/auth/verify-email.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="verify-email-card">
        <div class="header">
          <div class="logo">
            <img src="../../assets/images/logo.jpg" alt="" />
          </div>
          <h2>Light Hill PayFlow</h2>
          <p>DIGITAL FINANCIAL REQUEST &amp; APPROVAL SYSTEM</p>
        </div>
        <hr />

        <div class="description">
          <i class="fa-regular fa-envelope"></i>
          <h2>Verify Your Email</h2>
          <p>We've sent a 6-digit verification code to your email address.</p>
        </div>

        <form action="" method="">
          <div class="otp-container">
            <input type="text" maxlength="1" name="otp" class="otp-input" />
            <input type="text" maxlength="1" name="otp" class="otp-input" />
            <input type="text" maxlength="1" name="otp" class="otp-input" />
            <input type="text" maxlength="1" name="otp" class="otp-input" />
            <input type="text" maxlength="1" name="otp" class="otp-input" />
            <input type="text" maxlength="1" name="otp" class="otp-input" />
          </div>

          <button type="submit">Verify</button>
        </form>

        <p class="resend">
          Didn't receive the code? <a href="">Resend Code</a>
        </p>
      </div>
    </div>
  </body>
</html>
