<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/auth/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="../../assets/js/auth/login.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="login-card">
        <div class="header">
          <div class="logo">
            <img src="../../assets/images/logo.jpg" alt="">
          </div>
          <h2>Light Hill PayFlow</h2>
          <p>DIGITAL FINANCIAL REQUEST &amp; APPROVAL SYSTEM</p>
        </div>
        <hr />
        <form action="" method="">
          <div class="error-message hidden" id="error-message"></div>
          <label for="email"
            >Corporate Email Address <span class="required">*</span></label
          >
          <input
            type="email"
            id="email"
            name="email"
            placeholder="e.g. name@lighthill.com"
            required
          />

          <label for="password">Password <span class="required">*</span></label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter security password"
            required
          />

          <a href="forgot-password.html" class="forgot-link"
            >Forgot Password?</a
          >

          <button type="submit">Sign In</button>
        </form>
        <hr />
        <p>New to PayFlow? <a href="create-account.html" id="create-account">Create Account</a></p>
      </div>
    </div>
  </body>
</html>
