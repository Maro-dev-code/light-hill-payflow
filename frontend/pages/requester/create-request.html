<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Request | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard-shell.css" />
    <link
      rel="stylesheet"
      href="../../assets/css/requester/create-request.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../../assets/js/dashboard-shell.js" defer></script>
    <script src="../../assets/js/requester/create-request.js" defer></script>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <i class="fa-solid fa-mountain"></i>
          <span>PayFlow</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <button class="sidebar-logout" id="logout-btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
        </button>
      </aside>

      <div class="main-content">
        <div class="topbar">
          <h1>New Request</h1>
          <div class="topbar-user">
            <i class="fa-solid fa-circle-user"></i>
            <span id="user-name">Loading...</span>
          </div>
        </div>

        <div class="page-content">
          <div class="form-card">
            <div class="error-message hidden" id="error-message"></div>
            <div class="success-message hidden" id="success-message"></div>

            <form id="request-form">
              <label for="subject"
                >Subject <span class="required">*</span></label
              >
              <input
                type="text"
                id="subject"
                name="subject"
                placeholder="e.g. Office Internet Subscription Renewal"
                required
              />

              <label for="amount"
                >Amount (₦) <span class="required">*</span></label
              >
              <input
                type="number"
                id="amount"
                name="amount"
                placeholder="e.g. 150000"
                min="1"
                step="0.01"
                required
              />

              <label for="description"
                >Description <span class="required">*</span></label
              >
              <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Explain the purpose of this request..."
                required
              ></textarea>

              <label for="attachments">Supporting Attachments</label>
              <input
                type="file"
                id="attachments"
                name="attachments[]"
                multiple
              />
              <p class="field-hint">
                You can attach multiple files (receipts, quotes, invoices).
              </p>

              <button type="submit">Submit Request</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
