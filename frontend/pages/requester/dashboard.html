<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard-shell.css" />
    <link rel="stylesheet" href="../../assets/css/requester/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../../assets/js/dashboard-shell.js" defer></script>
    <script src="../../assets/js/requester/dashboard.js" defer></script>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <i class="fa-solid fa-mountain"></i>
          <span>PayFlow</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
          <!-- filled by dashboard-shell.js -->
        </nav>
        <button class="sidebar-logout" id="logout-btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
        </button>
      </aside>

      <div class="main-content">
        <div class="topbar">
          <h1>Dashboard</h1>
          <div class="topbar-user">
            <i class="fa-solid fa-circle-user"></i>
            <span id="user-name">Loading...</span>
          </div>
        </div>

        <div class="page-content">
          <div class="stats-grid">
            <div class="stat-card">
              <p class="stat-label">Pending</p>
              <h2 id="stat-pending">–</h2>
            </div>
            <div class="stat-card">
              <p class="stat-label">Approved</p>
              <h2 id="stat-approved">–</h2>
            </div>
            <div class="stat-card">
              <p class="stat-label">Paid</p>
              <h2 id="stat-paid">–</h2>
            </div>
            <div class="stat-card">
              <p class="stat-label">Rejected</p>
              <h2 id="stat-rejected">–</h2>
            </div>
          </div>

          <div class="section-header">
            <h2>Recent Requests</h2>
            <a href="create-request.html" class="btn-primary">
              <i class="fa-solid fa-plus"></i> New Request
            </a>
          </div>

          <table class="data-table" id="recent-requests-table">
            <thead>
              <tr>
                <th>Request ID</th>
                <th>Subject</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recent-requests-body">
              <tr><td colspan="5">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
