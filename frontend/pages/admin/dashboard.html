<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard-shell.css" />
    <link rel="stylesheet" href="../../assets/css/admin/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../../assets/js/dashboard-shell.js" defer></script>
    <script src="../../assets/js/admin/dashboard.js" defer></script>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <i class="fa-solid fa-mountain"></i>
          <span>PayFlow</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <button class="sidebar-logout" id="logout-btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
        </button>
      </aside>

      <div class="main-content">
        <div class="topbar">
          <h1>Admin Dashboard</h1>
          <div class="topbar-user">
            <i class="fa-solid fa-circle-user"></i>
            <span id="user-name">Loading...</span>
          </div>
        </div>

        <div class="page-content">
          <div class="stats-grid">
            <div class="stat-card">
              <p class="stat-label">Pending Accounts</p>
              <h2 id="stat-pending">–</h2>
            </div>
            <div class="stat-card">
              <p class="stat-label">Total Users</p>
              <h2 id="stat-total-users">–</h2>
            </div>
            <div class="stat-card">
              <p class="stat-label">Active Requests</p>
              <h2 id="stat-active-requests">–</h2>
            </div>
          </div>

          <div class="section-header">
            <h2>Accounts Awaiting Approval</h2>
            <a href="pending-accounts.html" class="btn-primary">
              <i class="fa-solid fa-user-clock"></i> View All
            </a>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Position</th>
                <th>Registered</th>
              </tr>
            </thead>
            <tbody id="pending-body">
              <tr><td colspan="4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
