<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Light Hill PayFlow</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard-shell.css" />
    <link rel="stylesheet" href="../../assets/css/admin/dashboard.css" />
    <link rel="stylesheet" href="../../assets/css/admin/create-privileged-account.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../../assets/js/dashboard-shell.js" defer></script>
    <script src="../../assets/js/admin/create-privileged-account.js" defer></script>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <i class="fa-solid fa-mountain"></i>
          <span>PayFlow</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <button class="sidebar-logout" id="logout-btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
        </button>
      </aside>

      <div class="main-content">
        <div class="topbar">
          <h1>Create Privileged Account</h1>
          <div class="topbar-user">
            <i class="fa-solid fa-circle-user"></i>
            <span id="user-name">Loading...</span>
          </div>
        </div>

        <div class="page-content">
          <div class="form-card">
            <div class="error-message hidden" id="error-message"></div>
            <div class="success-message hidden" id="success-message"></div>

            <form id="create-form">
              <label for="name">Full Name <span class="required">*</span></label>
              <input type="text" id="name" name="name" required>

              <label for="email">Corporate Email <span class="required">*</span></label>
              <input type="email" id="email" name="email" required>

              <label for="phone">Phone Number <span class="required">*</span></label>
              <input type="text" id="phone" name="phone" required>

              <label for="position">Position / Department <span class="required">*</span></label>
              <input type="text" id="position" name="position" required>

              <label for="role">Role <span class="required">*</span></label>
              <select id="role" name="role" required>
                <option value="">Select role</option>
                <option value="pba">PBA</option>
                <option value="cfo">CFO</option>
                <option value="coo">COO</option>
                <option value="accountant">Accountant</option>
                <option value="admin">Admin</option>
              </select>

              <label for="password">Temporary Password <span class="required">*</span></label>
              <input type="password" id="password" name="password" placeholder="8+ characters" required>

              <p class="field-hint">The user should change this password after first login.</p>

              <button type="submit">Create Account</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
